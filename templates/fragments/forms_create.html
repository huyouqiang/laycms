<div class="layui-card">
    <div class="layui-card-header">新建表单</div>
    <div class="layui-card-body">
        <form class="layui-form" action="/forms/" method="POST" style="max-width:640px;">
            <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
            <div class="layui-form-item">
                <label class="layui-form-label">分组</label>
                <div class="layui-input-block">
                    <select name="form_group_id" lay-verify="required">
                        {{range .FormGroups}}<option value="{{.ID}}">{{.Name}}</option>{{end}}
                    </select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">名称</label>
                <div class="layui-input-block">
                    <input type="text" name="name" required lay-verify="required" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">表名</label>
                <div class="layui-input-block">
                    <input type="text" name="table_name" required lay-verify="required" placeholder="小写字母数字下划线" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">描述</label>
                <div class="layui-input-block">
                    <input type="text" name="description" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-input-block">
                    <button type="submit" class="layui-btn layui-bg-cyan">创建</button>
                    <a href="{{urlFor "forms_index"}}" class="layui-btn layui-btn-primary">返回</a>
                </div>
            </div>
        </form>
    </div>
</div>
<script>layui.use(['form'], function(){ layui.form.render(); });</script>
