<div class="layui-card">
    <div class="layui-card-header">
        <button type="button" class="layui-btn layui-btn-sm layui-bg-cyan" id="btnAddGrp">新建用户组</button>
    </div>
    <div class="layui-card-body">
        <table class="layui-table" lay-skin="line">
            <thead><tr><th>ID</th><th>名称</th><th>用户数</th><th>操作</th></tr></thead>
            <tbody>
                {{range .Groups}}
                <tr>
                    <td>{{.ID}}</td>
                    <td>{{.Name}}</td>
                    <td>{{index $.GroupCounts .ID}}</td>
                    <td>
                        <button type="button" class="layui-btn layui-btn-xs btn-edit-g" data-id="{{.ID}}" data-name="{{.Name}}" data-desc="{{if .Description}}{{.Description}}{{end}}">编辑</button>
                        <a href="{{urlFor "permissions_edit" "group_id" (printf "%d" .ID)}}" class="layui-btn layui-btn-xs layui-btn-primary">权限</a>
                        <button type="button" class="layui-btn layui-btn-xs layui-btn-danger btn-del-g" data-id="{{.ID}}" {{if index $.GroupCounts .ID}}disabled{{end}}>删</button>
                    </td>
                </tr>
                {{end}}
            </tbody>
        </table>
    </div>
</div>

<div id="gModal" style="display:none;padding:16px;">
    <input type="hidden" id="g_id">
    <div class="layui-form-item">
        <label class="layui-form-label">名称</label>
        <div class="layui-input-block"><input type="text" id="g_name" class="layui-input" required></div>
    </div>
    <div class="layui-form-item layui-form-text">
        <label class="layui-form-label">描述</label>
        <div class="layui-input-block"><textarea id="g_desc" class="layui-textarea"></textarea></div>
    </div>
</div>

<script>
layui.use(['layer','jquery'], function(){
    var layer = layui.layer, $ = layui.$;
    $('#btnAddGrp').on('click', function(){
        $('#g_id').val(''); $('#g_name').val(''); $('#g_desc').val('');
        layer.open({type:1, title:'新建用户组', area:['440px','auto'], content:$('#gModal'), btn:['保存','取消'],
            yes:function(ix){
                $.post('/user-groups', {csrf_token:'{{.CSRFToken}}', name:$('#g_name').val(), description:$('#g_desc').val()})
                    .done(function(){ layer.close(ix); location.reload(); })
                    .fail(function(x){ layer.msg((x.responseJSON&&x.responseJSON.msg)||'失败'); });
            }});
    });
    $('.btn-edit-g').on('click', function(){
        var b = $(this);
        $('#g_id').val(b.data('id')); $('#g_name').val(b.data('name')); $('#g_desc').val(b.data('desc')||'');
        layer.open({type:1, title:'编辑用户组', area:['440px','auto'], content:$('#gModal'), btn:['保存','取消'],
            yes:function(ix){
                $.ajax({url:'/user-groups/'+$('#g_id').val(), method:'PUT',
                    data:{csrf_token:'{{.CSRFToken}}', name:$('#g_name').val(), description:$('#g_desc').val()}})
                    .done(function(){ layer.close(ix); location.reload(); })
                    .fail(function(x){ layer.msg((x.responseJSON&&x.responseJSON.msg)||'失败'); });
            }});
    });
    $('.btn-del-g').on('click', function(){
        if($(this).prop('disabled')) return;
        if(!confirm('确定删除？')) return;
        $.ajax({url:'/user-groups/'+$(this).data('id'), method:'DELETE'}).done(function(){ location.reload(); })
            .fail(function(x){ layer.msg((x.responseJSON&&x.responseJSON.msg)||'失败'); });
    });
});
</script>
